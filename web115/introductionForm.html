<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles/styles.css">
    <title>Introduction Form - Diana Alamilla-Ramirez - WEB115</title>
</head>

<body>
    <div data-include="components/header.html"></div>

    <main>
        <h2>Introduction Form</h2>

        <p>
            Edit the information below and submit the form to create
            your introduction.
        </p>

        <form id="introForm">

            <fieldset>
                <legend>Basic Information</legend>

                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    value="Diana Alamilla-Ramirez"
                    required
                >

                <label for="image">Image URL:</label>
                <input
                    type="text"
                    id="image"
                    value="images/diana-introduction.jpg"
                    required
                >

                <label for="caption">Image Caption:</label>
                <input
                    type="text"
                    id="caption"
                    value="Before Running a 5k with my Dad in 2026"
                    required
                >
            </fieldset>

            <fieldset>
                <legend>Introduction</legend>

                <label for="intro">Introduction:</label>
                <textarea id="intro" required>My name is Diana Alamilla-Ramirez, and I’ve lived in Charlotte all my life. I love fitness, and most of my life revolves around my lifting and running schedule. I use fitness to cope with the things in my life that I cannot control.</textarea>

                <label for="personal">Personal Background:</label>
                <textarea id="personal" required>I was born in Mexico. I love running and doing things that get the adrenaline rushing through my veins.</textarea>

                <label for="professional">Professional Background:</label>
                <textarea id="professional" required>I’ve worked in the restaurant industry for my entire life. I've worked as a server from age 12 to 20 and then switched to hostessing ever since.</textarea>

                <label for="academic">Academic Background:</label>
                <textarea id="academic" required>I’m currently finishing my associate degree at CPCC and plan to transfer to UNC Charlotte in the spring. I’m interested in technology, particularly data analysis and web development.</textarea>

                <label for="computer">Primary Computer:</label>
                <textarea id="computer" required>Apple MacBook, macOS, laptop, primarily used at home and school.</textarea>
            </fieldset>

            <fieldset>
                <legend>Courses</legend>

                <div id="courses">
                    <div class="course">
                        <label for="course1">Course 1:</label>
                        <input
                            type="text"
                            id="course1"
                            value="WEB 140 – Web Development Tools: I’m taking this course to learn more about the tools used to create and manage websites and to improve my web development skills."
                            required
                        >
                    </div>

                    <div class="course">
                        <label for="course2">Course 2:</label>
                        <input
                            type="text"
                            id="course2"
                            value="WEB 115 – Web Markup and Scripting: I’m taking this course to learn how websites are structured and how markup and scripting can be used to make them more interactive."
                            required
                        >
                    </div>

                    <div class="course">
                        <label for="course3">Course 3:</label>
                        <input
                            type="text"
                            id="course3"
                            value="CSC 152 – SAS: I’m taking this course to gain more experience working with data and using SAS for data analysis, which relates to my interest in data analytics."
                            required
                        >
                    </div>
                </div>

                <button type="button" id="addCourse">
                    Add Course
                </button>

                <button type="button" id="removeCourse">
                    Remove Course
                </button>
            </fieldset>

            <fieldset>
                <legend>Additional Information</legend>

                <label for="funny">
                    Funny/Interesting Item to Remember Me By:
                </label>
                <textarea id="funny" required>I usually start my day by waking up at 4 am and going to the gym.</textarea>

                <label for="quote">Quote:</label>
                <input
                    type="text"
                    id="quote"
                    value="Success is the sum of small efforts, repeated day in and day out."
                    required
                >

                <label for="quoteAuthor">Quote Author:</label>
                <input
                    type="text"
                    id="quoteAuthor"
                    value="Robert Collier"
                    required
                >
            </fieldset>

            <button type="submit">Submit Introduction</button>

        </form>

        <section id="results"></section>

    </main>

    <div data-include="components/footer.html"></div>

    <script src="scripts/HTMLInclude.js"></script>
    <script src="scripts/introductionForm.js"></script>
    <script
        src="https://lint.page/kit/880bd5.js"
        crossorigin="anonymous">
    </script>
</body>
</html>
